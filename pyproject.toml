[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "openbox-langchain-sdk-python"
version = "0.1.0"
description = "OpenBox governance and observability SDK for LangChain"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Pure LangChain-Core adapter: governance infra from the base SDK + the
    # LangChain-Core public callback system. No langgraph / openbox_langgraph.
    "openbox-sdk-python>=0.2.0",
    "langchain-core>=1.3.3",
]

[project.optional-dependencies]
# `create_agent` AgentMiddleware lives in langchain 1.x
# (langchain.agents.middleware.types). Only needed for the middleware/agent path,
# not for the core callback adapter — gated behind the `agent` extra.
agent = [
    "langchain>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

# Local dev wiring: the base SDK is not yet on PyPI, so resolve it from the
# sibling checkout. Stripped from the built wheel (hatchling reads only
# [project.dependencies]); the published wheel depends on openbox-sdk-python
# from the index (publish order: base -> langchain -> langgraph).
[tool.uv.sources]
openbox-sdk-python = { path = "../openbox-sdk-python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["openbox_langchain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
